name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  study-005-harness:
    name: Study 005 · deterministic harness
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"
      - name: Validate frozen fixtures and receipt behavior
        working-directory: studies/005-semantic-source-discovery
        run: python harness/study.py validate
      - name: Run harness and scorer tests
        working-directory: studies/005-semantic-source-discovery
        run: python -m unittest -v harness/test_study.py

  study-011-harness:
    name: Study 011 · deterministic harness
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install pytest
        # The study's harness is stdlib-only; pytest is a test-time tool.
        run: python -m pip install --disable-pip-version-check pytest
      - name: Verify the ported bytes against Study 010's lock
        working-directory: studies/011-authorship-coverage-rates
        run: python harness/integrity.py
      - name: Run the harness, control and fixture suite
        # The batch itself is API-dependent and never runs here; this suite is
        # deterministic and offline, and drives the real wrapper against a
        # stand-in CLI and a stand-in HOME. `analysis` carries the post-hoc
        # diversity census: it recomputes DIVERSITY.md's tables from the
        # retained bytes and fails if the tree or the document has drifted.
        working-directory: studies/011-authorship-coverage-rates
        run: python -m pytest harness/tests analysis -q

  study-012-harness:
    name: Study 012 · deterministic harness
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # The interpreter is a registry pin (PREREGISTRATION.md §2.10): the
          # harness, the wrapper and the scorer all refuse another
          # implementation or version series, so the series is pinned here and
          # the patch level is whatever the runner resolves.
          python-version: "3.12"
      - name: Install pytest
        # The study's harness is stdlib-only; pytest is a test-time tool.
        run: python -m pip install --disable-pip-version-check pytest
      - name: Verify the ported bytes and the arm artifacts (§6 C1, C8, C9, C10)
        working-directory: studies/012-policy-perturbation
        # README step 0 exports the safe import path for every command below
        # it, and this entry file REFUSES without it: invoking a script by path
        # puts its own directory first on sys.path, so its head imports resolve
        # from the directory the untracked-source scan exists to police (round
        # 10, finding 1).
        env:
          PYTHONSAFEPATH: "1"
        run: python harness/integrity.py
      - name: Run the harness, control and fixture suite
        # The batch itself is API-dependent and never runs here; this suite is
        # deterministic and offline, and drives the real wrapper against a
        # stand-in CLI and a stand-in HOME.
        #
        # PYTHONDONTWRITEBYTECODE is load-bearing rather than hygiene: without
        # it 61 of these tests fail. They run C1 as a batch precondition, and
        # §2.10's untracked-source gate refuses pytest's own assertion-rewrite
        # caches (harness/tests/__pycache__/*.cpython-312-pytest-*.pyc,
        # "unmappable name"). `-p no:cacheprovider` keeps .pytest_cache out of
        # the tree that gate walks. Both are what README step 0's ceremony
        # already uses.
        working-directory: studies/012-policy-perturbation
        env:
          PYTHONSAFEPATH: "1"
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m pytest harness/tests -q -p no:cacheprovider

  evidence-sufficiency:
    name: Evidence sufficiency · frozen case set
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Verify every frozen cell replays
        working-directory: evidence-sufficiency
        run: python replay.py
      - name: Run the case-set tests
        # Stdlib only, offline, no model: the case set drives the shipped
        # derivation rule and the clean-room evaluator over frozen artifacts.
        working-directory: evidence-sufficiency
        run: python -m unittest test_replay -v

  study-014-harness:
    name: Study 014 · deterministic harness
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # The exact pinned interpreter, not the series: harness/PINS.json
          # records 3.12.11 and harness/score.py refuses to adjudicate under
          # anything else.
          python-version: "3.12.11"
      - name: Install OpenWorkProof at the pinned commit
        # Hash-checked lockfile (upstream's, mirror index removed - see
        # studies/014-openworkproof-binding/upstream/MANIFEST.sha256), then the
        # package itself with no dependency resolution. Source is never vendored.
        run: |
          git clone https://github.com/dengyier/OpenWorkProof /tmp/OpenWorkProof
          git -C /tmp/OpenWorkProof checkout --quiet 8eeca6fff4a246374f9d64f4dc1af6ace42118d5
          python -m pip install --disable-pip-version-check -r studies/014-openworkproof-binding/upstream/requirements-lock-pypi.txt
          python -m pip install --disable-pip-version-check --no-deps /tmp/OpenWorkProof
          python -m pip install --disable-pip-version-check pytest
      - name: Fetch the pinned jpack release and verify its digests
        # The replay tuple's executable leg: archive and binary digests are the
        # ones harness/PINS.json records; a mismatch fails the job.
        run: |
          curl -sSL -o /tmp/jpack.tar.gz https://github.com/Judgment-Pack/judgment-pack-runtime/releases/download/v0.16.0/judgment-pack_0.16.0_linux_amd64.tar.gz
          echo "1a12503ca96061da3a8d5657528cea643668ef53a00a9b336e94755e2437ed59  /tmp/jpack.tar.gz" | sha256sum --check
          mkdir -p /tmp/jpack-bin && tar -xzf /tmp/jpack.tar.gz -C /tmp/jpack-bin jpack
          echo "7c11ebef430dec9a325fa3dd036963b6bbf5e2519f9c350a7ab89fb100b79325  /tmp/jpack-bin/jpack" | sha256sum --check
      - name: Run the adapter, control and fixture suite
        # Deterministic and offline once the toolchain is staged: the suite
        # verifies frozen fixture manifests, the whole-study manifest, the
        # SPEC/code verdict vocabulary sync and per-code reachability, the
        # upstream probes, a full rebuild of every cell, two byte-compared
        # scorer runs, and the registered controls. Both OWP_SOURCE and
        # JPACK_BIN are required - the suite fails rather than skips without
        # them, which is why the clone staged above is exported here. The matrix
        # adjudication itself is an attempt, not a test, and never runs here.
        working-directory: studies/014-openworkproof-binding
        env:
          JPACK_BIN: /tmp/jpack-bin/jpack
          OWP_SOURCE: /tmp/OpenWorkProof
        run: python -m pytest harness/tests -q

  study-016-harness:
    name: Study 016 · deterministic harness
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # The exact pinned interpreter: harness/PINS.json records 3.12.11 and
          # harness/score.py refuses to adjudicate under anything else.
          python-version: "3.12.11"
      - name: Install OpenWorkProof at the pinned commit
        # Same apparatus as Study 014 (same commit, same hash-checked lockfile
        # with the mirror index removed, same installed-package digest pin).
        run: |
          git clone https://github.com/dengyier/OpenWorkProof /tmp/OpenWorkProof
          git -C /tmp/OpenWorkProof checkout --quiet 8eeca6fff4a246374f9d64f4dc1af6ace42118d5
          python -m pip install --disable-pip-version-check -r studies/016-policy-currency-anchor/upstream/requirements-lock-pypi.txt
          python -m pip install --disable-pip-version-check --no-deps /tmp/OpenWorkProof
          python -m pip install --disable-pip-version-check pytest
      - name: Fetch the pinned jpack release and verify its digests
        # v0.17.0, the tuple every chain's commitment records; the archive
        # digest matches the release checksums.txt and the binary digest is the
        # one harness/PINS.json pins (reproduced from the tag - see the pin).
        run: |
          curl -sSL -o /tmp/jpack.tar.gz https://github.com/Judgment-Pack/judgment-pack-runtime/releases/download/v0.17.0/judgment-pack_0.17.0_linux_amd64.tar.gz
          echo "4046a101e3b638eee87f5d3f2f17b8337d2e4be35a34d45060789639b816d8dc  /tmp/jpack.tar.gz" | sha256sum --check
          mkdir -p /tmp/jpack-bin && tar -xzf /tmp/jpack.tar.gz -C /tmp/jpack-bin jpack
          echo "42f35f7900bea6dfce215631b50729ab22dd347289e1bde3412604fb043a22e9  /tmp/jpack-bin/jpack" | sha256sum --check
      - name: Run the registry, harness and fixture suite
        # Deterministic and offline once the toolchain is staged: per-code
        # reachability and ordering for the currency vocabulary, the SPEC/code
        # sync, the frozen Study 014 source pins, registered identity groups,
        # a full rebuild byte-compared against the committed cells, two
        # byte-compared scorer runs, and the registered controls. Both
        # OWP_SOURCE and JPACK_BIN are required - the suite fails rather than
        # skips without them. The matrix adjudication itself is an attempt,
        # not a test, and never runs here.
        working-directory: studies/016-policy-currency-anchor
        env:
          JPACK_BIN: /tmp/jpack-bin/jpack
          OWP_SOURCE: /tmp/OpenWorkProof
        run: python -m pytest harness/tests -q

  study-017-harness:
    name: Study 017 · deterministic harness
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # The exact pinned interpreter: harness/PINS.json records 3.12.11 and
          # harness/score.py refuses to adjudicate under anything else.
          python-version: "3.12.11"
      - name: Install the two third-party dependencies
        # Fully offline apparatus: no evaluator binary, no external clone. The
        # versions match the 016 apparatus venv the study was built in.
        run: python -m pip install --disable-pip-version-check "cryptography==49.0.0" "rfc8785==0.1.4" pytest
      - name: Run the witness, harness and fixture suite
        # Deterministic and offline: per-code reachability and ordering for the
        # witness vocabulary, the SPEC/code sync, the frozen Study 016 upstream
        # pins, the structurally validated collusion pair, a full rebuild
        # byte-compared against the committed cells, two byte-compared scorer
        # runs, and the registered controls. The matrix adjudication itself is
        # an attempt, not a test, and never runs here.
        working-directory: studies/017-witnessed-currency
        run: python -m pytest harness/tests -q

  study-018-harness:
    name: Study 018 · deterministic harness
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.11"
      - name: Install the two registered dependencies
        run: python -m pip install --disable-pip-version-check "cryptography==49.0.0" "rfc8785==0.1.4" pytest
      - name: Run the rule, harness and fixture suite
        # Fully offline: no evaluator binary, no external clone. Per-code
        # reachability for the transition vocabulary, the SPEC/code sync, the
        # frozen Study 016 upstream pins, the registered identity group (the
        # backdated-citation exhibit), the structural check that the four
        # divergence cells differ only in their rule configuration, a full
        # rebuild byte-compared against the committed cells, and two
        # byte-compared scorer runs. The matrix adjudication itself is an
        # attempt, not a test, and never runs here.
        working-directory: studies/018-transition-rules
        run: python -m pytest harness/tests -q

  python:
    name: ${{ matrix.os }} · Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.13"
          - os: macos-latest
            python: "3.13"
          - os: windows-latest
            python: "3.13"
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: python
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install pytest
        # The implementation itself is stdlib-only; pytest is a test-time tool.
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run tests
        run: python -m pytest tests/ -q
      - name: Confirm the implementation imports without third-party packages
        run: python -c "import jps_evaluator; print(jps_evaluator.__name__)"

  study-015-harness:
    name: Study 015 · deterministic harness
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # The exact pinned interpreter, not the series: harness/PINS.json records
          # 3.12.11 and harness/score.py refuses to adjudicate under anything else.
          python-version: "3.12.11"
      - name: Set up Node
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v5.0.0
        with:
          # The pinned probe node (harness/PINS.json harnessNode.version).
          node-version: "22.23.1"
      - name: Clone Cloudflare OS at the pinned commit and install its lockfile
        # Upstream's own pnpm-lock.yaml via the corepack-pinned pnpm; no postinstall
        # scripts exist in the workspace and --ignore-scripts keeps dependency build
        # scripts inert. Source is never vendored (CFOS_SOURCE points at the clone).
        run: |
          git clone https://github.com/cloudflare/cloudflare-os /tmp/cloudflare-os
          git -C /tmp/cloudflare-os checkout --quiet b2a51b5426398c8353d9d4dd984bd525121ab5f2
          corepack enable
          cd /tmp/cloudflare-os && pnpm install --frozen-lockfile --ignore-scripts
      - name: Fetch the pinned jpack release and verify its digests
        run: |
          curl -sSL -o /tmp/jpack.tar.gz https://github.com/Judgment-Pack/judgment-pack-runtime/releases/download/v0.16.0/judgment-pack_0.16.0_linux_amd64.tar.gz
          echo "1a12503ca96061da3a8d5657528cea643668ef53a00a9b336e94755e2437ed59  /tmp/jpack.tar.gz" | sha256sum --check
          mkdir -p /tmp/jpack-bin && tar -xzf /tmp/jpack.tar.gz -C /tmp/jpack-bin jpack
          echo "7c11ebef430dec9a325fa3dd036963b6bbf5e2519f9c350a7ab89fb100b79325  /tmp/jpack-bin/jpack" | sha256sum --check
      - name: Install the pinned harness dependencies
        working-directory: studies/015-cloudflare-os-boundary
        run: python -m pip install --disable-pip-version-check -r harness/requirements.txt
      - name: Run the protocol-integrity, reachability and upstream-probe suites
        # The suite covers the SPEC/code vocabulary and ordering sync, per-code
        # reachability, the registry and manifest gates, the fixture typecheck against
        # the pinned server-side types, and the upstream-behaviour probes.
        working-directory: studies/015-cloudflare-os-boundary
        env:
          CFOS_SOURCE: /tmp/cloudflare-os
          JPACK_BIN: /tmp/jpack-bin/jpack
        run: python -m pytest harness/tests -q
